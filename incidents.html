<!doctype html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>STRATIQ — Incident Command Center</title>
  <meta name="description" content="Incident Command Center & Automated Root Cause Analysis" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="public/css/styles.css" />
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-[var(--bg-canvas)] text-[var(--text-primary)] antialiased selection:bg-amber-500/20 selection:text-amber-200">
  <div class="flex h-screen overflow-hidden">
    <!-- Sidebar -->
    <aside id="stratiq-sidebar" class="w-64 shrink-0 hidden lg:block h-full"></aside>

    <!-- Main Content Area -->
    <div class="flex-1 flex flex-col h-full overflow-hidden">
      <!-- Navbar -->
      <div id="stratiq-navbar" class="shrink-0"></div>

      <!-- Page Scrollable View -->
      <main class="flex-1 overflow-y-auto p-4 sm:p-6 lg:p-8 space-y-6">
        
        <!-- Header & Action Controls -->
        <div class="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4">
          <div>
            <div class="flex items-center gap-2">
              <span class="text-xs font-mono uppercase text-amber-500 font-bold">OPERATIONAL RESPONSE</span>
              <span class="text-[var(--text-metadata)]">•</span>
              <span class="text-xs font-mono text-[var(--text-metadata)]">TIER 1 INCIDENT MATRIX</span>
            </div>
            <h1 class="text-xl sm:text-2xl font-bold text-[var(--text-primary)] font-editorial tracking-tight">
              Incident Command Center
            </h1>
          </div>

          <div class="flex items-center gap-2.5">
            <button
              id="report-incident-btn"
              class="px-4 py-2.5 rounded-2xl bg-gradient-to-r from-amber-500 to-amber-600 hover:from-amber-400 hover:to-amber-500 text-neutral-950 font-bold text-xs shadow-md shadow-amber-500/20 flex items-center gap-2 cursor-pointer transition-all"
            >
              <i data-lucide="plus-circle" class="w-4 h-4"></i>
              <span>Report Incident</span>
            </button>
          </div>
        </div>

        <!-- Filter & Search Controls Bar -->
        <div class="spotlight-card p-4 rounded-2xl flex flex-col md:flex-row items-stretch md:items-center justify-between gap-3">
          <!-- Filter Tabs -->
          <div class="flex items-center gap-1.5 overflow-x-auto pb-1 md:pb-0" id="filter-tabs">
            <button data-filter="ALL" class="filter-tab px-3 py-1.5 rounded-xl text-xs font-semibold bg-amber-500 text-neutral-950">All Incidents</button>
            <button data-filter="CRITICAL" class="filter-tab px-3 py-1.5 rounded-xl text-xs font-semibold bg-[var(--bg-surface-elevated)] text-[var(--text-muted)] hover:text-[var(--text-primary)]">Critical Only</button>
            <button data-filter="ACTIVE" class="filter-tab px-3 py-1.5 rounded-xl text-xs font-semibold bg-[var(--bg-surface-elevated)] text-[var(--text-muted)] hover:text-[var(--text-primary)]">Active</button>
            <button data-filter="RESOLVED" class="filter-tab px-3 py-1.5 rounded-xl text-xs font-semibold bg-[var(--bg-surface-elevated)] text-[var(--text-muted)] hover:text-[var(--text-primary)]">Resolved</button>
          </div>

          <!-- Search Input -->
          <div class="relative min-w-[240px]">
            <i data-lucide="search" class="w-4 h-4 text-[var(--text-metadata)] absolute left-3 top-2.5"></i>
            <input
              id="incident-search"
              type="text"
              placeholder="Search by title, number, or facility..."
              class="w-full bg-[var(--bg-surface-elevated)] border border-[var(--border-hairline)] rounded-xl pl-9 pr-3 py-2 text-xs text-[var(--text-primary)] placeholder-[var(--text-metadata)] focus:outline-none focus:border-amber-500"
            />
          </div>
        </div>

        <!-- Incidents Grid -->
        <div id="incidents-grid" class="grid grid-cols-1 gap-4">
          <!-- Dynamically populated -->
        </div>

      </main>
    </div>
  </div>

  <!-- Create Incident Modal -->
  <div id="create-incident-modal" class="modal-backdrop">
    <div class="modal-content max-w-lg p-6 space-y-5 animate-fade-in">
      <div class="flex items-center justify-between border-b border-[var(--border-hairline)] pb-3">
        <h3 class="text-base font-bold text-[var(--text-primary)]">Report Operational Incident</h3>
        <button onclick="closeModal('create-incident-modal')" class="p-1.5 rounded-xl bg-[var(--bg-surface-elevated)] text-[var(--text-muted)]">
          <i data-lucide="x" class="w-4 h-4"></i>
        </button>
      </div>

      <form id="create-incident-form" class="space-y-3.5 text-xs">
        <div>
          <label class="block text-[var(--text-muted)] font-mono uppercase text-[10px] mb-1 font-bold">Incident Title</label>
          <input id="new-inc-title" required type="text" placeholder="e.g. Pune MCU Shortage: DHL Delay" class="w-full bg-[var(--bg-surface-elevated)] border border-[var(--border-hairline)] rounded-xl p-2.5 text-[var(--text-primary)] focus:outline-none focus:border-amber-500" />
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-[var(--text-muted)] font-mono uppercase text-[10px] mb-1 font-bold">Priority Level</label>
            <select id="new-inc-priority" class="w-full bg-[var(--bg-surface-elevated)] border border-[var(--border-hairline)] rounded-xl p-2.5 text-[var(--text-primary)] focus:outline-none focus:border-amber-500">
              <option value="CRITICAL">CRITICAL</option>
              <option value="HIGH">HIGH</option>
              <option value="MEDIUM" selected>MEDIUM</option>
              <option value="LOW">LOW</option>
            </select>
          </div>

          <div>
            <label class="block text-[var(--text-muted)] font-mono uppercase text-[10px] mb-1 font-bold">Affected Location</label>
            <select id="new-inc-location" class="w-full bg-[var(--bg-surface-elevated)] border border-[var(--border-hairline)] rounded-xl p-2.5 text-[var(--text-primary)] focus:outline-none focus:border-amber-500">
              <option value="loc-pune-wh">Pune Assembly Hub (PUN-01)</option>
              <option value="loc-mumbai-hub">Mumbai Port Central Depot</option>
              <option value="loc-bengaluru-tech">Bengaluru R&D Facility</option>
            </select>
          </div>
        </div>

        <div>
          <label class="block text-[var(--text-muted)] font-mono uppercase text-[10px] mb-1 font-bold">Description & Root Cause</label>
          <textarea id="new-inc-desc" rows="3" placeholder="Provide operational context..." class="w-full bg-[var(--bg-surface-elevated)] border border-[var(--border-hairline)] rounded-xl p-2.5 text-[var(--text-primary)] focus:outline-none focus:border-amber-500"></textarea>
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-[var(--text-muted)] font-mono uppercase text-[10px] mb-1 font-bold">Affected Orders</label>
            <input id="new-inc-orders" type="number" value="50" class="w-full bg-[var(--bg-surface-elevated)] border border-[var(--border-hairline)] rounded-xl p-2.5 text-[var(--text-primary)] font-mono focus:outline-none focus:border-amber-500" />
          </div>

          <div>
            <label class="block text-[var(--text-muted)] font-mono uppercase text-[10px] mb-1 font-bold">Revenue Exposure (INR ₹)</label>
            <input id="new-inc-rev" type="number" value="250000" class="w-full bg-[var(--bg-surface-elevated)] border border-[var(--border-hairline)] rounded-xl p-2.5 text-[var(--text-primary)] font-mono focus:outline-none focus:border-amber-500" />
          </div>
        </div>

        <div class="pt-3 border-t border-[var(--border-hairline)] flex justify-end gap-2">
          <button type="button" onclick="closeModal('create-incident-modal')" class="px-4 py-2 rounded-xl bg-[var(--bg-surface-elevated)] text-[var(--text-muted)]">Cancel</button>
          <button type="submit" class="px-5 py-2 rounded-xl bg-amber-500 text-neutral-950 font-bold">Create Incident Record</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Scripts -->
  <script src="public/js/seed.js"></script>
  <script src="public/js/store.js"></script>
  <script src="public/js/components.js"></script>
  <script>
    let activeFilter = 'ALL';
    let searchQuery = '';

    function renderIncidentsPage() {
      renderSharedLayout('incidents');

      const incidents = window.store.getIncidents();
      const filtered = incidents.filter(inc => {
        if (activeFilter === 'CRITICAL' && inc.priority !== 'CRITICAL') return false;
        if (activeFilter === 'ACTIVE' && inc.status === 'RESOLVED') return false;
        if (activeFilter === 'RESOLVED' && inc.status !== 'RESOLVED') return false;
        
        if (searchQuery) {
          const matchTitle = inc.title.toLowerCase().includes(searchQuery);
          const matchNum = inc.incident_number.toLowerCase().includes(searchQuery);
          const matchLoc = inc.location?.name.toLowerCase().includes(searchQuery);
          return matchTitle || matchNum || matchLoc;
        }
        return true;
      });

      const grid = document.getElementById('incidents-grid');
      if (filtered.length === 0) {
        grid.innerHTML = `<div class="spotlight-card p-12 text-center text-xs text-[var(--text-muted)] rounded-3xl">No operational incidents match your filter.</div>`;
      } else {
        grid.innerHTML = filtered.map(inc => {
          const isCrit = inc.priority === 'CRITICAL';
          const isResolved = inc.status === 'RESOLVED';
          return `
            <div class="spotlight-card p-5 sm:p-6 rounded-3xl space-y-4 ${isCrit && !isResolved ? 'border-rose-500/40 bg-rose-950/10' : ''}">
              <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 pb-3 border-b border-[var(--border-hairline)]">
                <div class="flex items-center gap-2">
                  <span class="px-2.5 py-0.5 rounded-full text-[10px] font-mono font-bold uppercase ${
                    isCrit ? 'bg-rose-500 text-white animate-pulse' :
                    inc.priority === 'HIGH' ? 'bg-amber-500 text-neutral-950 font-bold' :
                    'bg-blue-500 text-white'
                  }">${inc.priority}</span>
                  <span class="text-xs font-mono text-[var(--text-metadata)] font-bold">${inc.incident_number}</span>
                  <span class="px-2.5 py-0.5 rounded-full text-[10px] font-mono font-bold uppercase ${
                    isResolved ? 'bg-emerald-500/20 text-emerald-400 border border-emerald-500/30' : 'bg-amber-500/20 text-amber-400 border border-amber-500/30'
                  }">${inc.status}</span>
                </div>

                <div class="text-xs font-mono text-[var(--text-metadata)]">
                  Created: ${new Date(inc.created_at).toLocaleDateString()} ${new Date(inc.created_at).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}
                </div>
              </div>

              <div class="grid grid-cols-1 lg:grid-cols-3 gap-4">
                <div class="lg:col-span-2 space-y-2">
                  <h3 class="text-base font-bold text-[var(--text-primary)] font-editorial">${inc.title}</h3>
                  <p class="text-xs text-[var(--text-muted)] leading-relaxed">${inc.description || 'No detailed log provided.'}</p>
                  
                  <div class="flex flex-wrap items-center gap-3 pt-2 text-[11px] font-mono text-[var(--text-metadata)]">
                    <span class="flex items-center gap-1.5">
                      <i data-lucide="map-pin" class="w-3.5 h-3.5 text-amber-500"></i>
                      <span>${inc.location?.name || 'Pune Logistics Hub'}</span>
                    </span>
                    <span>•</span>
                    <span class="flex items-center gap-1.5">
                      <i data-lucide="user" class="w-3.5 h-3.5 text-emerald-500"></i>
                      <span>${inc.owner?.full_name || 'Aarav Deshmukh'}</span>
                    </span>
                  </div>
                </div>

                <div class="p-4 rounded-2xl bg-[var(--bg-surface-elevated)] border border-[var(--border-hairline)] flex flex-col justify-between space-y-3">
                  <div class="space-y-1">
                    <div class="text-[10px] font-mono uppercase text-[var(--text-metadata)] font-bold">Revenue Exposure</div>
                    <div class="text-xl font-bold font-mono ${isCrit && !isResolved ? 'text-rose-500' : 'text-[var(--text-primary)]'}">
                      ₹${(inc.revenue_impact / 100000).toFixed(1)} Lakhs
                    </div>
                    <div class="text-xs text-[var(--text-muted)]">${inc.affected_orders} customer orders blocked</div>
                  </div>

                  <div class="flex items-center gap-2 pt-2 border-t border-[var(--border-hairline)]">
                    <button
                      onclick="openIncidentModal('${inc.id}')"
                      class="flex-1 px-3 py-2 rounded-xl bg-[var(--bg-surface)] hover:bg-amber-500/10 border border-[var(--border-hairline)] text-xs text-[var(--text-primary)] font-bold flex items-center justify-center gap-1.5 cursor-pointer transition-all"
                    >
                      <i data-lucide="network" class="w-3.5 h-3.5 text-amber-500"></i>
                      <span>Root Cause Graph</span>
                    </button>

                    ${!isResolved ? `
                      <button
                        onclick="window.store.resolveIncident('${inc.id}'); showToast('Incident #${inc.incident_number} resolved!', 'success');"
                        class="px-3 py-2 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold flex items-center justify-center gap-1 cursor-pointer"
                        title="Mark Resolved"
                      >
                        <i data-lucide="check" class="w-3.5 h-3.5"></i>
                      </button>
                    ` : ''}
                  </div>
                </div>
              </div>
            </div>
          `;
        }).join('');
      }

      if (window.lucide) window.lucide.createIcons();
    }

    document.addEventListener('DOMContentLoaded', () => {
      renderIncidentsPage();
      window.store.subscribe(() => renderIncidentsPage());

      // Filter tabs event
      document.querySelectorAll('.filter-tab').forEach(tab => {
        tab.addEventListener('click', () => {
          document.querySelectorAll('.filter-tab').forEach(t => {
            t.className = 'filter-tab px-3 py-1.5 rounded-xl text-xs font-semibold bg-[var(--bg-surface-elevated)] text-[var(--text-muted)] hover:text-[var(--text-primary)] cursor-pointer';
          });
          tab.className = 'filter-tab px-3 py-1.5 rounded-xl text-xs font-semibold bg-amber-500 text-neutral-950 font-bold cursor-pointer';
          activeFilter = tab.dataset.filter;
          renderIncidentsPage();
        });
      });

      // Search event
      document.getElementById('incident-search').addEventListener('input', (e) => {
        searchQuery = e.target.value.toLowerCase().trim();
        renderIncidentsPage();
      });

      // Report Incident Modal trigger
      document.getElementById('report-incident-btn').addEventListener('click', () => {
        document.getElementById('create-incident-modal').classList.add('active');
      });

      // Report form submit
      document.getElementById('create-incident-form').addEventListener('submit', (e) => {
        e.preventDefault();
        window.store.createIncident({
          title: document.getElementById('new-inc-title').value,
          priority: document.getElementById('new-inc-priority').value,
          location_id: document.getElementById('new-inc-location').value,
          description: document.getElementById('new-inc-desc').value,
          affected_orders: Number(document.getElementById('new-inc-orders').value),
          revenue_impact: Number(document.getElementById('new-inc-rev').value),
        });
        closeModal('create-incident-modal');
        showToast('New operational incident successfully logged!', 'success');
      });
    });
  </script>
</body>
</html>
