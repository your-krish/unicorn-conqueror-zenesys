<!doctype html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>STRATIQ — Inventory & Logistics Hubs</title>
  <meta name="description" content="Multi-Facility Stock Distribution & Buffer Threshold Management" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="public/css/styles.css" />
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-[var(--bg-canvas)] text-[var(--text-primary)] antialiased selection:bg-amber-500/20 selection:text-amber-200">
  <div class="flex h-screen overflow-hidden">
    <!-- Sidebar -->
    <aside id="stratiq-sidebar" class="w-64 shrink-0 hidden lg:block h-full"></aside>

    <!-- Main Content Area -->
    <div class="flex-1 flex flex-col h-full overflow-hidden">
      <!-- Navbar -->
      <div id="stratiq-navbar" class="shrink-0"></div>

      <!-- Page Scrollable View -->
      <main class="flex-1 overflow-y-auto p-4 sm:p-6 lg:p-8 space-y-6">
        
        <!-- Header -->
        <div class="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4">
          <div>
            <div class="flex items-center gap-2">
              <span class="text-xs font-mono uppercase text-emerald-500 font-bold">WAREHOUSE LOGISTICS</span>
              <span class="text-[var(--text-metadata)]">•</span>
              <span class="text-xs font-mono text-[var(--text-metadata)]">3 REGIONAL DISTRIBUTION HUBS</span>
            </div>
            <h1 class="text-xl sm:text-2xl font-bold text-[var(--text-primary)] font-editorial tracking-tight">
              Inventory & Facilities Management
            </h1>
          </div>

          <div class="flex items-center gap-2.5">
            <button
              onclick="openStockTransferModal()"
              class="px-4 py-2.5 rounded-2xl bg-gradient-to-r from-emerald-500 to-emerald-600 hover:from-emerald-400 hover:to-emerald-500 text-neutral-950 font-bold text-xs shadow-md shadow-emerald-500/20 flex items-center gap-2 cursor-pointer transition-all"
            >
              <i data-lucide="arrow-left-right" class="w-4 h-4"></i>
              <span>Initiate Stock Transfer</span>
            </button>
          </div>
        </div>

        <!-- Facility Capacity Utilization Cards -->
        <div id="warehouses-grid" class="grid grid-cols-1 md:grid-cols-3 gap-4">
          <!-- Dynamically loaded -->
        </div>

        <!-- Inventory Stock Matrix Table Container -->
        <div class="spotlight-card rounded-3xl p-6 space-y-5">
          <div class="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-3 pb-3 border-b border-[var(--border-hairline)]">
            <div>
              <h3 class="text-sm font-bold text-[var(--text-primary)] font-editorial">SKU Inventory & Buffer Health</h3>
              <p class="text-xs text-[var(--text-muted)]">Real-time stock thresholds across regional depots</p>
            </div>

            <!-- Search Filter -->
            <div class="relative w-full sm:w-64">
              <i data-lucide="search" class="w-3.5 h-3.5 text-[var(--text-metadata)] absolute left-3 top-2.5"></i>
              <input
                id="inventory-search"
                type="text"
                placeholder="Filter by SKU or product..."
                class="w-full bg-[var(--bg-surface-elevated)] border border-[var(--border-hairline)] rounded-xl pl-9 pr-3 py-1.5 text-xs text-[var(--text-primary)] placeholder-[var(--text-metadata)] focus:outline-none focus:border-emerald-500"
              />
            </div>
          </div>

          <!-- Stock Table -->
          <div class="overflow-x-auto">
            <table class="w-full text-left text-xs">
              <thead>
                <tr class="border-b border-[var(--border-hairline)] text-[10px] font-mono uppercase text-[var(--text-metadata)] tracking-wider">
                  <th class="pb-3 font-bold">Product / SKU</th>
                  <th class="pb-3 font-bold">Facility Location</th>
                  <th class="pb-3 font-bold text-right">Current Stock</th>
                  <th class="pb-3 font-bold text-right">Min Buffer</th>
                  <th class="pb-3 font-bold text-right">Reserved</th>
                  <th class="pb-3 font-bold text-center">Status</th>
                  <th class="pb-3 font-bold text-right">Quick Action</th>
                </tr>
              </thead>
              <tbody id="inventory-table-body" class="divide-y divide-[var(--border-hairline)]">
                <!-- Dynamically populated -->
              </tbody>
            </table>
          </div>
        </div>

      </main>
    </div>
  </div>

  <!-- Scripts -->
  <script src="public/js/seed.js"></script>
  <script src="public/js/store.js"></script>
  <script src="public/js/components.js"></script>
  <script>
    let filterQuery = '';

    function renderInventoryPage() {
      renderSharedLayout('inventory');

      const warehouses = window.store.getWarehouses();
      const inventory = window.store.getInventory();

      // Render Warehouses Grid
      const whGrid = document.getElementById('warehouses-grid');
      whGrid.innerHTML = warehouses.map(wh => {
        const pct = Math.min(100, Math.round((wh.current_capacity / wh.max_capacity) * 100));
        return `
          <div class="spotlight-card p-5 rounded-3xl space-y-3">
            <div class="flex items-center justify-between">
              <div class="p-2 rounded-xl bg-[var(--bg-surface-elevated)] text-emerald-500 inline-block">
                <i data-lucide="building-2" class="w-4 h-4"></i>
              </div>
              <span class="px-2 py-0.5 rounded-full text-[10px] font-mono font-bold uppercase ${pct > 90 ? 'bg-amber-500/15 text-amber-500 border border-amber-500/30' : 'bg-emerald-500/15 text-emerald-500 border border-emerald-500/30'}">
                ${wh.status}
              </span>
            </div>
            <div>
              <h4 class="text-sm font-bold text-[var(--text-primary)] font-editorial">${wh.name}</h4>
              <div class="text-[10px] font-mono text-[var(--text-metadata)]">Code: ${wh.code}</div>
            </div>
            <div class="space-y-1.5 pt-1">
              <div class="flex justify-between text-xs font-mono">
                <span class="text-[var(--text-muted)]">Capacity:</span>
                <span class="font-bold text-[var(--text-primary)]">${wh.current_capacity.toLocaleString()} / ${wh.max_capacity.toLocaleString()}</span>
              </div>
              <div class="w-full h-2 bg-[var(--bg-surface-elevated)] rounded-full overflow-hidden">
                <div class="h-full rounded-full ${pct > 90 ? 'bg-amber-500' : 'bg-emerald-500'}" style="width: ${pct}%"></div>
              </div>
              <div class="text-right text-[10px] font-mono text-[var(--text-metadata)]">${pct}% Utilized</div>
            </div>
          </div>
        `;
      }).join('');

      // Filter Inventory
      const filtered = inventory.filter(item => {
        if (!filterQuery) return true;
        const pName = item.product?.name.toLowerCase() || '';
        const pSku = item.product?.sku.toLowerCase() || '';
        const wName = item.warehouse?.name.toLowerCase() || '';
        return pName.includes(filterQuery) || pSku.includes(filterQuery) || wName.includes(filterQuery);
      });

      const tbody = document.getElementById('inventory-table-body');
      tbody.innerHTML = filtered.map(item => {
        const isDeficit = item.current_stock < item.minimum_stock;
        return `
          <tr class="hover:bg-[var(--bg-surface-elevated)] transition-colors">
            <td class="py-3.5">
              <div class="font-bold text-[var(--text-primary)]">${item.product?.name || 'Item'}</div>
              <div class="text-[10px] font-mono text-[var(--text-metadata)]">${item.product?.sku} • ${item.product?.category}</div>
            </td>
            <td class="py-3.5 font-mono text-[var(--text-muted)]">
              ${item.warehouse?.name || 'Main Depot'}
            </td>
            <td class="py-3.5 text-right font-mono font-bold ${isDeficit ? 'text-rose-500' : 'text-[var(--text-primary)]'}">
              ${item.current_stock.toLocaleString()} units
            </td>
            <td class="py-3.5 text-right font-mono text-[var(--text-muted)]">
              ${item.minimum_stock.toLocaleString()}
            </td>
            <td class="py-3.5 text-right font-mono text-[var(--text-metadata)]">
              ${item.reserved_stock.toLocaleString()}
            </td>
            <td class="py-3.5 text-center">
              <span class="px-2.5 py-0.5 rounded-full text-[10px] font-mono font-bold uppercase ${
                isDeficit ? 'bg-rose-500/20 text-rose-400 border border-rose-500/30 animate-pulse' :
                'bg-emerald-500/20 text-emerald-400 border border-emerald-500/30'
              }">
                ${isDeficit ? 'DEFICIT RISK' : 'OPTIMAL BUFFER'}
              </span>
            </td>
            <td class="py-3.5 text-right">
              <button
                onclick="openStockTransferModal('${item.product_id}', '${item.warehouse_id}')"
                class="px-3 py-1.5 rounded-xl bg-[var(--bg-surface-elevated)] hover:bg-emerald-500/20 hover:text-emerald-400 border border-[var(--border-hairline)] text-xs text-[var(--text-muted)] font-semibold transition-all cursor-pointer"
              >
                Transfer Stock
              </button>
            </td>
          </tr>
        `;
      }).join('');

      if (window.lucide) window.lucide.createIcons();
    }

    document.addEventListener('DOMContentLoaded', () => {
      renderInventoryPage();
      window.store.subscribe(() => renderInventoryPage());

      document.getElementById('inventory-search').addEventListener('input', (e) => {
        filterQuery = e.target.value.toLowerCase().trim();
        renderInventoryPage();
      });
    });
  </script>
</body>
</html>
