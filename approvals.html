<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>STRATIQ — Approvals & Authorization Center</title>
  <meta name="description" content="Multi-Step Operational Authorization & Signoff Ledger" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="public/css/styles.css" />
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-[var(--bg-canvas)] text-[var(--text-primary)] antialiased selection:bg-amber-500/20 selection:text-amber-200">
  <div class="flex h-screen overflow-hidden">
    <!-- Sidebar -->
    <aside id="stratiq-sidebar" class="w-64 shrink-0 hidden lg:block h-full"></aside>

    <!-- Main Content Area -->
    <div class="flex-1 flex flex-col h-full overflow-hidden">
      <!-- Navbar -->
      <div id="stratiq-navbar" class="shrink-0"></div>

      <!-- Page Scrollable View -->
      <main class="flex-1 overflow-y-auto p-4 sm:p-6 lg:p-8 space-y-6">
        
        <!-- Header -->
        <div class="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4">
          <div>
            <div class="flex items-center gap-2">
              <span class="text-xs font-mono uppercase text-amber-500 font-bold">OPERATIONAL GOVERNANCE</span>
              <span class="text-[var(--text-metadata)]">•</span>
              <span class="text-xs font-mono text-[var(--text-metadata)]">MULTI-TIER DISPATCH AUTHORIZATION</span>
            </div>
            <h1 class="text-xl sm:text-2xl font-bold text-[var(--text-primary)] font-editorial tracking-tight">
              Approvals & Workflow Authorization
            </h1>
          </div>
        </div>

        <!-- Approvals Queue -->
        <div class="spotlight-card rounded-3xl p-6 space-y-4">
          <div class="flex items-center justify-between pb-3 border-b border-[var(--border-hairline)]">
            <div>
              <h3 class="text-sm font-bold text-[var(--text-primary)] font-editorial">Pending Authorization Queue</h3>
              <p class="text-xs text-[var(--text-muted)]">Commercial expenditure and inter-depot stock dispatch signoffs</p>
            </div>
          </div>

          <div id="approvals-list" class="space-y-4">
            <!-- Dynamically populated -->
          </div>
        </div>

      </main>
    </div>
  </div>

  <!-- Scripts -->
  <script src="public/js/seed.js"></script>
  <script src="public/js/store.js"></script>
  <script src="public/js/components.js"></script>
  <script>
    function renderApprovalsPage() {
      renderSharedLayout('approvals');

      const approvals = window.store.getApprovals();
      const list = document.getElementById('approvals-list');

      if (approvals.length === 0) {
        list.innerHTML = `<div class="p-8 text-center text-xs text-[var(--text-muted)]">All operational authorization queues are clear.</div>`;
        return;
      }

      list.innerHTML = approvals.map(appr => {
        const isPending = appr.status === 'PENDING';
        return `
          <div class="p-5 rounded-2xl bg-[var(--bg-surface-elevated)] border border-[var(--border-hairline)] space-y-3">
            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 pb-3 border-b border-[var(--border-hairline)]">
              <div class="flex items-center gap-2.5">
                <span class="px-2.5 py-0.5 rounded-full text-[10px] font-mono font-bold uppercase ${
                  isPending ? 'bg-amber-500/20 text-amber-400 border border-amber-500/30' : 'bg-emerald-500/20 text-emerald-400 border border-emerald-500/30'
                }">
                  ${appr.status}
                </span>
                <span class="text-xs font-mono text-[var(--text-metadata)] font-bold">
                  Step ${appr.step} of ${appr.total_steps}
                </span>
                <span class="px-2 py-0.5 rounded text-[10px] font-mono bg-[var(--bg-surface)] text-[var(--text-muted)] border border-[var(--border-hairline)]">
                  ${appr.entity_type}
                </span>
              </div>

              <div class="text-sm font-mono font-bold text-emerald-500">
                ₹${(appr.amount / 100000).toFixed(2)} Lakhs
              </div>
            </div>

            <div class="space-y-1">
              <p class="text-xs text-[var(--text-primary)] font-medium leading-relaxed">${appr.comments}</p>
              <div class="text-[10px] font-mono text-[var(--text-metadata)]">
                Requested by: <span class="text-[var(--text-primary)]">${appr.requester?.full_name || 'Aarav Deshmukh'}</span> • Required Role: <span class="text-amber-500">${appr.approver_role_required}</span>
              </div>
            </div>

            ${isPending ? `
              <div class="pt-3 border-t border-[var(--border-hairline)] flex items-center justify-end gap-2.5">
                <button
                  onclick="window.store.processApproval('${appr.id}', window.store.currentUser.id, 'REJECTED'); showToast('Authorization request rejected.', 'danger');"
                  class="px-4 py-2 rounded-xl bg-[var(--bg-surface)] hover:bg-rose-500/20 hover:text-rose-400 border border-[var(--border-hairline)] text-xs text-[var(--text-muted)] font-semibold transition-all cursor-pointer"
                >
                  Reject Signoff
                </button>
                <button
                  onclick="window.store.processApproval('${appr.id}', window.store.currentUser.id, 'APPROVED'); showToast('Authorization granted & logged to immutable audit ledger!', 'success');"
                  class="px-5 py-2 rounded-xl bg-gradient-to-r from-emerald-500 to-emerald-600 hover:from-emerald-400 hover:to-emerald-500 text-neutral-950 font-bold text-xs shadow-md shadow-emerald-500/20 flex items-center gap-1.5 cursor-pointer transition-all"
                >
                  <i data-lucide="check" class="w-3.5 h-3.5"></i>
                  <span>Authorize & Signoff</span>
                </button>
              </div>
            ` : `
              <div class="pt-2 text-right text-[11px] font-mono text-emerald-500 flex items-center justify-end gap-1.5">
                <i data-lucide="check-circle-2" class="w-4 h-4"></i>
                <span>Signed off by ${appr.approver?.full_name || 'Vikramaditya Singh'}</span>
              </div>
            `}
          </div>
        `;
      }).join('');

      if (window.lucide) window.lucide.createIcons();
    }

    document.addEventListener('DOMContentLoaded', () => {
      renderApprovalsPage();
      window.store.subscribe(() => renderApprovalsPage());
    });
  </script>
</body>
</html>
