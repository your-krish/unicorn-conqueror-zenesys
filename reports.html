<!doctype html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>STRATIQ — Executive Operations Reports</title>
  <meta name="description" content="Executive Summary, Post-Mortems, and CSV Export Engine" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="public/css/styles.css" />
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-[var(--bg-canvas)] text-[var(--text-primary)] antialiased selection:bg-amber-500/20 selection:text-amber-200">
  <div class="flex h-screen overflow-hidden">
    <!-- Sidebar -->
    <aside id="stratiq-sidebar" class="w-64 shrink-0 hidden lg:block h-full"></aside>

    <!-- Main Content Area -->
    <div class="flex-1 flex flex-col h-full overflow-hidden">
      <!-- Navbar -->
      <div id="stratiq-navbar" class="shrink-0"></div>

      <!-- Page Scrollable View -->
      <main class="flex-1 overflow-y-auto p-4 sm:p-6 lg:p-8 space-y-6">
        
        <!-- Header -->
        <div class="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4">
          <div>
            <div class="flex items-center gap-2">
              <span class="text-xs font-mono uppercase text-amber-500 font-bold">OPERATIONAL INTELLIGENCE</span>
              <span class="text-[var(--text-metadata)]">•</span>
              <span class="text-xs font-mono text-[var(--text-metadata)]">ENTERPRISE AUDIT & TELEMETRY</span>
            </div>
            <h1 class="text-xl sm:text-2xl font-bold text-[var(--text-primary)] font-editorial tracking-tight">
              Executive Operations Reports
            </h1>
          </div>

          <div class="flex items-center gap-2.5">
            <button
              id="export-csv-btn"
              class="px-4 py-2.5 rounded-2xl bg-[var(--bg-surface-elevated)] hover:bg-emerald-500/20 hover:text-emerald-400 border border-[var(--border-hairline)] text-xs text-[var(--text-primary)] font-bold flex items-center gap-2 cursor-pointer transition-all"
            >
              <i data-lucide="download" class="w-4 h-4 text-emerald-500"></i>
              <span>Export CSV Ledger</span>
            </button>

            <button
              onclick="window.print()"
              class="px-4 py-2.5 rounded-2xl bg-amber-500 hover:bg-amber-400 text-neutral-950 font-bold text-xs flex items-center gap-2 cursor-pointer transition-all"
            >
              <i data-lucide="printer" class="w-4 h-4"></i>
              <span>Print Executive Dossier</span>
            </button>
          </div>
        </div>

        <!-- Report Tabs Selector -->
        <div class="flex items-center gap-2 p-1.5 rounded-2xl bg-[var(--bg-surface)] border border-[var(--border-hairline)] max-w-fit">
          <button data-report="summary" class="report-tab px-4 py-2 rounded-xl text-xs font-bold bg-amber-500 text-neutral-950 cursor-pointer">
            Executive Summary
          </button>
          <button data-report="postmortem" class="report-tab px-4 py-2 rounded-xl text-xs font-semibold text-[var(--text-muted)] hover:text-[var(--text-primary)] cursor-pointer">
            Incident Post-Mortem
          </button>
          <button data-report="inventory" class="report-tab px-4 py-2 rounded-xl text-xs font-semibold text-[var(--text-muted)] hover:text-[var(--text-primary)] cursor-pointer">
            Warehouse Stock Audit
          </button>
        </div>

        <!-- Report Content Container -->
        <div id="report-view-container" class="spotlight-card rounded-3xl p-6 sm:p-8 space-y-6">
          <!-- Dynamically populated -->
        </div>

      </main>
    </div>
  </div>

  <!-- Scripts -->
  <script src="public/js/seed.js"></script>
  <script src="public/js/store.js"></script>
  <script src="public/js/components.js"></script>
  <script>
    let activeReport = 'summary';

    function renderReportsPage() {
      renderSharedLayout('reports');

      const container = document.getElementById('report-view-container');
      const metrics = window.store.getMetrics();
      const incidents = window.store.getIncidents();
      const inventory = window.store.getInventory();

      if (activeReport === 'summary') {
        container.innerHTML = `
          <div class="space-y-6 animate-fade-in">
            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 pb-4 border-b border-[var(--border-hairline)]">
              <div>
                <span class="text-[10px] font-mono uppercase text-amber-500 font-bold">EXECUTIVE DOSSIER</span>
                <h2 class="text-xl font-bold text-[var(--text-primary)] font-editorial mt-0.5">Enterprise Operations Health Summary</h2>
                <p class="text-xs text-[var(--text-muted)]">Apex Semiconductor Ltd. • Consolidated Relational Snapshot</p>
              </div>
              <div class="text-xs font-mono text-[var(--text-metadata)] text-right">
                <div>Period: Current Fiscal Quarter</div>
                <div>Status: Relational Sync Online</div>
              </div>
            </div>

            <!-- Summary KPI metrics -->
            <div class="grid grid-cols-2 sm:grid-cols-4 gap-4">
              <div class="p-4 rounded-2xl bg-[var(--bg-surface-elevated)] border border-[var(--border-hairline)]">
                <span class="text-[10px] font-mono text-[var(--text-metadata)] uppercase">Enterprise Health</span>
                <div class="text-2xl font-bold font-mono ${metrics.enterprise_health < 80 ? 'text-amber-500' : 'text-emerald-500'} mt-1">${metrics.enterprise_health}%</div>
              </div>
              <div class="p-4 rounded-2xl bg-[var(--bg-surface-elevated)] border border-[var(--border-hairline)]">
                <span class="text-[10px] font-mono text-[var(--text-metadata)] uppercase">Critical Incidents</span>
                <div class="text-2xl font-bold font-mono text-rose-500 mt-1">${metrics.critical_incidents} Active</div>
              </div>
              <div class="p-4 rounded-2xl bg-[var(--bg-surface-elevated)] border border-[var(--border-hairline)]">
                <span class="text-[10px] font-mono text-[var(--text-metadata)] uppercase">Revenue Exposure</span>
                <div class="text-2xl font-bold font-mono text-[var(--text-primary)] mt-1">₹${(metrics.revenue_at_risk / 100000).toFixed(1)}L</div>
              </div>
              <div class="p-4 rounded-2xl bg-[var(--bg-surface-elevated)] border border-[var(--border-hairline)]">
                <span class="text-[10px] font-mono text-[var(--text-metadata)] uppercase">Blocked Orders</span>
                <div class="text-2xl font-bold font-mono text-[var(--text-primary)] mt-1">${metrics.affected_orders}</div>
              </div>
            </div>

            <div class="space-y-3">
              <h3 class="text-sm font-bold text-[var(--text-primary)] font-editorial">Executive Findings & Key Risks</h3>
              <p class="text-xs text-[var(--text-muted)] leading-relaxed">
                The primary vulnerability observed is the single-node dependency on Frankfurt air cargo customs routing for high-performance TX-9 microcontrollers. While Mumbai Port Central Depot preserves a robust 1,850 unit buffer, Pune assembly facility operating buffers fell to critical threshold (42 units) during flight connection delays.
              </p>
              <div class="p-4 rounded-2xl bg-amber-500/10 border border-amber-500/20 text-xs text-[var(--text-primary)] space-y-1">
                <span class="font-bold text-amber-500">Recommended Executive Directive:</span>
                <p class="text-[var(--text-muted)] text-[11px]">
                  Authorize automated inter-depot stock rebalancing rule triggering express transit when Pune buffer falls below 150 units.
                </p>
              </div>
            </div>
          </div>
        `;
      } else if (activeReport === 'postmortem') {
        const critInc = incidents.find(i => i.id === 'inc-pune-critical-01') || incidents[0];
        container.innerHTML = `
          <div class="space-y-6 animate-fade-in">
            <div class="flex items-center justify-between pb-4 border-b border-[var(--border-hairline)]">
              <div>
                <span class="text-[10px] font-mono uppercase text-rose-500 font-bold">INCIDENT POST-MORTEM</span>
                <h2 class="text-xl font-bold text-[var(--text-primary)] font-editorial mt-0.5">${critInc.incident_number}: ${critInc.title}</h2>
              </div>
              <span class="px-3 py-1 rounded-full text-xs font-mono font-bold uppercase bg-rose-500/20 text-rose-400 border border-rose-500/30">
                ${critInc.status}
              </span>
            </div>

            <div class="space-y-4 text-xs text-[var(--text-muted)] leading-relaxed">
              <div>
                <h4 class="text-xs font-bold text-[var(--text-primary)] font-mono uppercase mb-1">1. Executive Summary</h4>
                <p>${critInc.description}</p>
              </div>

              <div>
                <h4 class="text-xs font-bold text-[var(--text-primary)] font-mono uppercase mb-1">2. Root Cause Correlation</h4>
                <p>DHL Cargo flight connecting Frankfurt to Mumbai was held up during customs export validation for dual-use electronics classification. Because Pune maintained a lean local stock buffer of only 42 units, downstream production lines experienced an immediate halt affecting 243 committed customer shipments.</p>
              </div>

              <div>
                <h4 class="text-xs font-bold text-[var(--text-primary)] font-mono uppercase mb-1">3. Mitigation & Remediation</h4>
                <p>Dispatched 300 emergency replacement units from Mumbai Port Central Depot via Pune Expressway dedicated transit (3.5 hour transit window).</p>
              </div>
            </div>
          </div>
        `;
      } else {
        container.innerHTML = `
          <div class="space-y-6 animate-fade-in">
            <div class="pb-4 border-b border-[var(--border-hairline)]">
              <span class="text-[10px] font-mono uppercase text-emerald-500 font-bold">INVENTORY RECONCILIATION</span>
              <h2 class="text-xl font-bold text-[var(--text-primary)] font-editorial mt-0.5">Facility Stock Ledger & Buffer Analysis</h2>
            </div>

            <div class="overflow-x-auto">
              <table class="w-full text-left text-xs">
                <thead>
                  <tr class="border-b border-[var(--border-hairline)] text-[10px] font-mono uppercase text-[var(--text-metadata)]">
                    <th class="pb-3 font-bold">Facility</th>
                    <th class="pb-3 font-bold">Product SKU</th>
                    <th class="pb-3 font-bold text-right">Current Units</th>
                    <th class="pb-3 font-bold text-right">Safety Threshold</th>
                    <th class="pb-3 font-bold text-center">Status</th>
                  </tr>
                </thead>
                <tbody class="divide-y divide-[var(--border-hairline)]">
                  ${inventory.map(item => `
                    <tr>
                      <td class="py-3 font-medium text-[var(--text-primary)]">${item.warehouse?.name}</td>
                      <td class="py-3 font-mono text-[var(--text-muted)]">${item.product?.name} (${item.product?.sku})</td>
                      <td class="py-3 font-mono text-right font-bold">${item.current_stock.toLocaleString()}</td>
                      <td class="py-3 font-mono text-right text-[var(--text-metadata)]">${item.minimum_stock.toLocaleString()}</td>
                      <td class="py-3 text-center">
                        <span class="px-2 py-0.5 rounded-full text-[9px] font-mono font-bold ${item.current_stock < item.minimum_stock ? 'bg-rose-500/20 text-rose-400' : 'bg-emerald-500/20 text-emerald-400'}">
                          ${item.current_stock < item.minimum_stock ? 'DEFICIT' : 'OPTIMAL'}
                        </span>
                      </td>
                    </tr>
                  `).join('')}
                </tbody>
              </table>
            </div>
          </div>
        `;
      }

      if (window.lucide) window.lucide.createIcons();
    }

    // CSV Download Engine
    function exportCSV() {
      const inventory = window.store.getInventory();
      let csvContent = "data:text/csv;charset=utf-8,Facility,Product,SKU,Category,Current_Stock,Minimum_Buffer,Reserved_Stock\n";
      
      inventory.forEach(i => {
        csvContent += `"${i.warehouse?.name}","${i.product?.name}","${i.product?.sku}","${i.product?.category}",${i.current_stock},${i.minimum_stock},${i.reserved_stock}\n`;
      });

      const encodedUri = encodeURI(csvContent);
      const link = document.createElement("a");
      link.setAttribute("href", encodedUri);
      link.setAttribute("download", `STRATIQ_Operations_Report_${Date.now()}.csv`);
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      showToast('CSV Operations Ledger successfully exported!', 'success');
    }

    document.addEventListener('DOMContentLoaded', () => {
      renderReportsPage();
      window.store.subscribe(() => renderReportsPage());

      document.querySelectorAll('.report-tab').forEach(tab => {
        tab.addEventListener('click', () => {
          document.querySelectorAll('.report-tab').forEach(t => {
            t.className = 'report-tab px-4 py-2 rounded-xl text-xs font-semibold text-[var(--text-muted)] hover:text-[var(--text-primary)] cursor-pointer';
          });
          tab.className = 'report-tab px-4 py-2 rounded-xl text-xs font-bold bg-amber-500 text-neutral-950 cursor-pointer';
          activeReport = tab.dataset.report;
          renderReportsPage();
        });
      });

      document.getElementById('export-csv-btn')?.addEventListener('click', exportCSV);
    });
  </script>
</body>
</html>
