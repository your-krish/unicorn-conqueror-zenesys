    <script>
      // Safe fetch descriptor shim to prevent "Cannot set property fetch of #<Window> which has only a getter"
      (function() {
        try {
          var originalFetch = typeof window !== 'undefined' && window.fetch ? window.fetch.bind(window) : null;
          var activeFetch = originalFetch;
          if (originalFetch) {
            Object.defineProperty(window, 'fetch', {
              get: function() { return activeFetch || originalFetch; },
              set: function(newFetch) { activeFetch = newFetch; },
              configurable: true,
              enumerable: true
            });
          }
        } catch (e) {
          console.warn('Window fetch shim initialization notice:', e);
        }
      })();
    </script>

  </body>
